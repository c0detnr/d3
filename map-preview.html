<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><title>IRON DUST · Orman eşiği</title></head><body><canvas id="map"></canvas><div id="aim-intent" aria-hidden="true">+</div><div id="aim-bore" hidden aria-hidden="true"></div><div id="aim-status" role="status"></div><div id="combat-hud" aria-live="off"><span id="ammo-state">SİLAH HAZIR</span><progress id="reload-progress" max="1" value="1" aria-label="Dolum"></progress><span id="range-readout">— m</span><span id="hit-result"></span></div><div id="status" role="status">Sahne yükleniyor…</div>
<div id="touch-controls" aria-label="Dokunmatik oyun kontrolleri">
  <nav class="touch-tools"><button data-action="sound" aria-label="Sesi aç veya kapat">SES</button><button data-action="reset" aria-label="Tankı başlangıca döndür">KURTAR</button><button data-action="weapon" aria-label="Silah değiştir">MG</button></nav>
  <div class="touch-stick drive-stick" data-stick="drive" role="group" aria-label="Sürüş çubuğu"><span class="stick-guide">▲</span><i></i><b>SÜRÜŞ</b></div>
  <button class="touch-button brake-button" data-action="brake" aria-label="Fren">FREN</button>
  <div class="touch-stick aim-stick" data-stick="aim" role="group" aria-label="Taret ve namlu nişan çubuğu"><span class="aim-cross">＋</span><i></i><b>NİŞAN</b></div>
  <button class="touch-button zoom-button" data-action="zoom" aria-label="Basılı tutarak yakınlaştır">⌕</button>
  <button class="touch-button fire-button" data-action="fire" aria-label="Ateş"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="13"/><path d="M24 3v13m0 16v13M3 24h13m16 0h13"/></svg><span>ATEŞ</span></button>
</div><div id="rotate-hint">Telefonu yatay çevir</div><script type="module" src="/src/mapPreview.ts"></script></body></html>
