<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#1b221e"/>
  <title>IRON DUST</title>
  <link rel="icon" href="data:,"/>
  <link rel="stylesheet" href="/src/game/ui/loadingScreen.css"/>
  <style>
    @font-face {
      font-family: Barlow;
      src: url('./src/game/ui/fonts/BarlowCondensed-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-display: swap;
    }
    :root {
      --loading-bg: #1b221e;
      --loading-paper: #f3eddf;
      --loading-dim: #d2d3c3;
      --loading-accent: #e1bd8d;
      --loading-surface: #26332b;
      --loading-border: #96a38c;
    }
    body {
      margin: 0;
      background: var(--loading-bg);
      color: var(--loading-paper);
      font-family: Barlow, 'Barlow Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--loading-bg);
      background-image: radial-gradient(circle at 50% 45%, #243128 0%, #1a231d 60%, #121814 100%);
      color: var(--loading-paper);
      user-select: none;
      -webkit-user-select: none;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      pointer-events: auto;
    }
    #loading-screen.loading-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #loading-screen.loading-mission-mode {
      background-color: rgba(23, 31, 25, 0.94);
      background-image: radial-gradient(circle at 50% 45%, rgba(36, 49, 40, 0.94) 0%, rgba(26, 35, 29, 0.96) 60%, rgba(18, 24, 20, 0.98) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(440px, 86vw);
      padding: 32px 24px;
      box-sizing: border-box;
    }
    .loading-title {
      font-family: Barlow, 'Barlow Condensed', sans-serif;
      font-size: clamp(38px, 6vw, 54px);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--loading-paper);
      margin: 0 0 28px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .loading-title::before,
    .loading-title::after {
      content: '';
      display: inline-block;
      width: 14px;
      height: 2px;
      background: var(--loading-accent);
      opacity: 0.8;
    }
    .loading-progress-box {
      width: 100%;
      margin-bottom: 14px;
    }
    .loading-bar-track {
      width: 100%;
      height: 6px;
      background: rgba(38, 51, 43, 0.9);
      border: 1px solid rgba(150, 163, 140, 0.4);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c79e6b 0%, #e1bd8d 100%);
      box-shadow: 0 0 8px rgba(225, 189, 141, 0.5);
      border-radius: 2px;
      transition: width 0.18s cubic-bezier(0.1, 0.7, 0.1, 1);
    }
    .loading-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 8px;
      font-size: 13px;
      color: var(--loading-dim);
      font-family: Barlow, 'Barlow Condensed', sans-serif;
      letter-spacing: 0.04em;
    }
    .loading-stage {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
      text-align: left;
    }
    .loading-percent {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--loading-paper);
    }
    .loading-tip-container {
      margin-top: 36px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(150, 163, 140, 0.2);
      padding-top: 16px;
      width: 100%;
    }
    .loading-tip {
      font-size: 14px;
      color: var(--loading-dim);
      line-height: 1.45;
      font-style: normal;
      transition: opacity 0.25s ease;
      opacity: 1;
    }
    .loading-tip.tip-fading {
      opacity: 0;
    }
    .loading-error-box {
      margin-top: 20px;
      padding: 16px 20px;
      background: rgba(70, 24, 24, 0.88);
      border: 1px solid #d45b5b;
      border-radius: 4px;
      color: #ffe0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    .loading-error-msg {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }
    .loading-retry-btn {
      padding: 8px 22px;
      background: var(--loading-accent);
      color: #1b221e;
      border: 1px solid var(--loading-accent);
      border-radius: 3px;
      font-family: Barlow, 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .loading-retry-btn:hover {
      background: #f6d6aa;
    }
    .loading-retry-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="game-shell shell-menu">
  <div id="loading-screen" class="loading-screen" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
    <div class="loading-content">
      <div class="loading-title">IRON DUST</div>
      <div class="loading-progress-box">
        <div class="loading-bar-track">
          <div id="loading-bar-fill" class="loading-bar-fill"></div>
        </div>
        <div class="loading-meta">
          <span id="loading-stage" class="loading-stage">Yükleniyor...</span>
          <span id="loading-percent" class="loading-percent">0%</span>
        </div>
      </div>
      <div class="loading-tip-container">
        <div id="loading-tip" class="loading-tip"></div>
      </div>
      <div id="loading-error" class="loading-error-box" hidden>
        <p id="loading-error-msg" class="loading-error-msg"></p>
        <button id="loading-retry" class="loading-retry-btn" type="button">Yeniden dene</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var lang = 'tr';
      try {
        var raw = localStorage.getItem('iron-dust.player.v1');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.settings && parsed.settings.language === 'en') lang = 'en';
        } else if (navigator.language && !navigator.language.toLowerCase().startsWith('tr')) {
          lang = 'en';
        }
      } catch (e) {
        if (navigator.language && !navigator.language.toLowerCase().startsWith('tr')) lang = 'en';
      }

      var tips = lang === 'en' ? [
        'Smoke screen blocks enemy line of sight.',
        'Look with the mouse, the turret follows.',
        'Angling your hull increases the chance of ricochets.',
        'Enemy side and rear armor is significantly weaker.',
        'Firing on the move reduces accuracy.'
      ] : [
        'Sis perdesi düşmanın görüşünü keser.',
        'Fareyle bak, kule takip eder.',
        'Gövde açısı mermilerin sekme şansını artırır.',
        'Düşman tankının yan ve arka zırhı daha zayıftır.',
        'Hareket halindeyken atış yapmak isabet oranını düşürür.'
      ];

      var tipEl = document.getElementById('loading-tip');
      var stageEl = document.getElementById('loading-stage');
      var retryEl = document.getElementById('loading-retry');
      if (stageEl) stageEl.textContent = lang === 'en' ? 'Loading...' : 'Yükleniyor...';
      if (retryEl) {
        retryEl.textContent = lang === 'en' ? 'Retry' : 'Yeniden dene';
        retryEl.onclick = function() { location.reload(); };
      }
      if (tipEl) tipEl.textContent = tips[0];

      // Instant WebGL 2 check
      try {
        var canvas = document.createElement('canvas');
        var gl = canvas.getContext('webgl2');
        if (!gl) {
          console.error('[IRON DUST] WebGL 2.0 is not supported or disabled on this device/browser.');
          var errorBox = document.getElementById('loading-error');
          var errorMsg = document.getElementById('loading-error-msg');
          var progressBox = document.querySelector('.loading-progress-box');
          var tipContainer = document.querySelector('.loading-tip-container');
          if (errorBox && errorMsg) {
            errorMsg.textContent = lang === 'en'
              ? 'WebGL 2.0 is not supported or disabled. Please check your browser hardware acceleration.'
              : 'WebGL 2.0 desteklenmiyor veya devre dışı. Lütfen tarayıcınızın donanım ivmesini kontrol edin.';
            errorBox.hidden = false;
            if (progressBox) progressBox.style.display = 'none';
            if (tipContainer) tipContainer.style.display = 'none';
          }
        }
      } catch (err) {
        console.error('[IRON DUST] WebGL 2 check error:', err);
      }
    })();
  </script>

  <div id="game-layer"></div>
  <div id="shell-root"></div>
  <script type="module" src="/src/game/ui/LoadingScreen.ts"></script>
  <script type="module" src="/src/game/ui/GameShell.tsx"></script>
</body>
</html>
