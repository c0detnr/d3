<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: #2a2d26; }
  body { font-family: "Barlow", sans-serif; color: #f2efe6; }
  .stage { position: relative; width: 100%; height: 100%; background-size: var(--bgsize, cover); background-position: var(--bgpos, center); }
  .shade { position: absolute; inset: 0; background: var(--shade); }
  .content { position: absolute; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 1); }
  .logo { width: var(--logo); display: block; filter: drop-shadow(0 2px 8px rgba(20,22,18,.5)); }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--h1, calc(var(--u) * 3)); line-height: 1; letter-spacing: .02em; color: #f2efe6; text-shadow: 0 2px 10px rgba(20,22,18,.45); }
  p { font-size: calc(var(--u) * 1.1); line-height: 1.35; color: #dcd8cc; max-width: var(--pmax); text-shadow: 0 1px 6px rgba(20,22,18,.6); }
  .cta-row { display: flex; align-items: center; gap: calc(var(--u) * 1.1); margin-top: calc(var(--u) * .4); }
  .cta { font-family: "Barlow Condensed", sans-serif; background: #d9a441; color: #1f1d17; font-weight: 700; font-size: calc(var(--u) * 1.3); letter-spacing: .08em; padding: calc(var(--u) * .5) calc(var(--u) * 1.5); border-radius: calc(var(--u) * .2); }
  .platform { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: calc(var(--u) * 1); letter-spacing: .14em; color: #e6e1d4; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="shade"></div>
  <div class="content" id="content">
    <img class="logo" src="../../../public/brand/ashfield-wordmark.png" alt="ASHFIELD">
    <h1>TOZU DUMANA<br>KAT!</h1>
    <p>Low poly tank savaşı. Sür, nişan al, takımınla kazan.</p>
    <div class="cta-row">
      <div class="cta">ŞİMDİ OYNA</div>
      <div class="platform">DESKTOP &amp; MOBILE</div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +q.get('w'), h = +q.get('h'), r = document.documentElement.style;
  const square = w / h < 1.2;
  r.setProperty('--w', w + 'px'); r.setProperty('--h', h + 'px');
  const u = Math.min(w, h * 1.78) / 48;
  r.setProperty('--u', u + 'px');
  document.getElementById('stage').style.backgroundImage = `url(${square ? 'keyart-square.png' : 'keyart-wide.png'})`;
  const c = document.getElementById('content');
  if (square) {
    r.setProperty('--logo', w * 0.5 + 'px');
    r.setProperty('--bgpos', 'center bottom');
    r.setProperty('--shade', 'linear-gradient(180deg, rgba(30,33,27,.78) 0%, rgba(30,33,27,.35) 38%, rgba(30,33,27,0) 55%, rgba(30,33,27,0) 78%, rgba(30,33,27,.7) 100%)');
    Object.assign(c.style, { left: w * .08 + 'px', top: h * .07 + 'px' });
    document.querySelector('h1').innerHTML = 'TOZU DUMANA KAT!';
    document.querySelector('p').style.display = 'none';
    Object.assign(document.querySelector('.cta-row').style, { position: 'fixed', left: w * .08 + 'px', bottom: h * .07 + 'px', margin: 0 });
  } else {
    r.setProperty('--logo', w * 0.27 + 'px');
    r.setProperty('--pmax', w * 0.3 + 'px');
    r.setProperty('--h1', u * 2.6 + 'px');
    r.setProperty('--bgpos', 'right bottom');
    r.setProperty('--shade', 'linear-gradient(90deg, rgba(30,33,27,.85) 0%, rgba(30,33,27,.55) 32%, rgba(30,33,27,0) 55%)');
    Object.assign(c.style, { left: w * .06 + 'px', top: '50%', transform: 'translateY(-50%)' });
  }
</script>
</body>
</html>
