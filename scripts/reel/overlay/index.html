<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Reel yazı katmanı</title>
<!-- Saira Stencil One ve JetBrains Mono: Google Fonts, SIL Open Font License. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Saira+Stencil+One&display=block">
<style>
  :root { --sand: #D9C9A3; --khaki: #6B6B3A; --signal: #F2B705; --stamp: #B3261E; --band: rgba(0, 0, 0, .6); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { position: relative; font-family: 'JetBrains Mono', monospace; color: var(--sand); }
  .layer { position: absolute; inset: 0; }
  .vignette { background: radial-gradient(ellipse 75% 60% at 50% 48%, transparent 55%, rgba(0, 0, 0, .42) 100%); }
  .flash { background: #fff; opacity: 0; }

  .corner { position: absolute; width: 64px; height: 64px; border: 0 solid rgba(217, 201, 163, .75); }
  .corner.tl { left: 44px; top: 44px; border-left-width: 4px; border-top-width: 4px; }
  .corner.tr { right: 44px; top: 44px; border-right-width: 4px; border-top-width: 4px; }
  .corner.bl { left: 44px; bottom: 44px; border-left-width: 4px; border-bottom-width: 4px; }
  .corner.br { right: 44px; bottom: 44px; border-right-width: 4px; border-bottom-width: 4px; }

  .header { position: absolute; left: 72px; top: 268px; display: flex; gap: 18px; align-items: center;
    font-size: 28px; font-weight: 700; letter-spacing: .08em; padding: 8px 16px; background: var(--band); }
  .rec { color: var(--stamp); }
  .header .file { color: var(--signal); }

  .block { position: absolute; left: 72px; top: 352px; width: 860px; }
  .title { font-family: 'Saira Stencil One', sans-serif; font-size: 104px; line-height: 1.04; margin: 0; }
  .title.xl { font-size: 150px; }
  .title span.line { display: inline; background: var(--band); padding: 2px 20px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .title b { color: var(--signal); font-weight: inherit; }
  .title i.cursor { font-style: normal; color: var(--signal); }
  .subs { margin-top: 26px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .sub { font-size: 36px; font-weight: 500; padding: 6px 16px; background: var(--band); }
  .sub b { color: var(--signal); font-weight: 700; }

  .card-tag { position: absolute; left: 72px; top: 820px; font-size: 26px; font-weight: 700; letter-spacing: .14em;
    color: var(--sand); border: 3px solid var(--khaki); padding: 8px 14px; background: rgba(20, 20, 8, .55); }
  .stamp { position: absolute; left: 470px; top: 760px; font-family: 'Saira Stencil One', sans-serif; font-size: 92px;
    color: var(--stamp); border: 9px solid var(--stamp); padding: 4px 26px 0; transform-origin: center;
    background: rgba(217, 201, 163, .14); }

  .disclaimer { position: absolute; left: 72px; width: 860px; bottom: 330px; font-size: 22px; line-height: 1.4;
    color: rgba(217, 201, 163, .9); background: rgba(0, 0, 0, .5); padding: 8px 14px; box-sizing: border-box; }
</style>
</head>
<body>
<div class="layer vignette"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="header" id="header"><span class="rec" id="rec">● REC</span><span id="clock">00:00:00</span><span class="file" id="file"></span></div>
<div class="block" id="block"><h1 class="title" id="title"></h1><div class="subs" id="subs"></div></div>
<div id="card"></div>
<div id="stamp"></div>
<div id="disclaimer"></div>
<div class="layer flash" id="flash"></div>
<script>
/** Deterministic overlay: compose.ts calls renderAt(t) for every output frame and screenshots only changed frames. */
// The flash stays below full opacity: a fully opaque screenshot is saved as RGB without alpha, and ffmpeg drops that frame from the RGBA sequence.
const TYPE = 0.2, SUB_DELAY = 4 / 30, SUB_STEP = 4 / 30, SUB_IN = 0.25, FLASH = [0.96, 0.55];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let edit, starts;

window.setEdit = data => {
  edit = data; starts = [];
  let at = 0;
  for (const slot of edit.slots) { starts.push(at); at += slot.seconds; }
  $('file').textContent = edit.file;
  const fonts = ['104px "Saira Stencil One"', '500 36px "JetBrains Mono"', '700 36px "JetBrains Mono"'];
  return Promise.all(fonts.map(f => document.fonts.load(f, 'AĞİŞ'))).then(() => {
    if (!fonts.every(f => document.fonts.check(f, 'AĞİŞ'))) return false;
    // Shrink each title until its longest line fits between the side margins (72 px each).
    const probe = document.createElement('h1');
    probe.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap';
    document.body.append(probe);
    for (const slot of edit.slots) for (const item of slot.text) {
      probe.className = 'title' + (item.size === 'xl' ? ' xl' : '');
      probe.innerHTML = titleHtml(chars(item.title), false);
      let size = parseFloat(getComputedStyle(probe).fontSize);
      while (probe.scrollWidth > 936 && size > 40) probe.style.fontSize = `${--size}px`;
      item.fontSize = size;
      probe.style.fontSize = '';
    }
    probe.remove();
    return true;
  });
};

/** "{a} b" → [{ch, accent}] so typing can stop mid-accent. */
function chars(title) {
  const out = []; let accent = false;
  for (const ch of title) {
    if (ch === '{') accent = true; else if (ch === '}') accent = false; else out.push({ ch, accent });
  }
  return out;
}
function titleHtml(list, cursor) {
  const lines = [[]];
  for (const c of list) c.ch === '\n' ? lines.push([]) : lines.at(-1).push(c);
  return lines.map((line, i) => {
    let html = '', open = false;
    for (const c of line) {
      if (c.accent !== open) { html += c.accent ? '<b>' : '</b>'; open = c.accent; }
      html += esc(c.ch);
    }
    if (open) html += '</b>';
    if (cursor && i === lines.length - 1) html += '<i class="cursor">▌</i>';
    return html || cursor ? `<span class="line">${html}</span>` : '';
  }).join('<br>');
}
function subHtml(text) {
  const m = /^([A-ZÇĞİÖŞÜ ]+):\s(.*)$/.exec(text);
  return m ? `<b>${esc(m[1])}</b> ${esc(m[2])}` : esc(text);
}
const ease = x => 1 - (1 - Math.min(1, Math.max(0, x))) ** 3;

window.renderAt = t => {
  let index = starts.findLastIndex(s => s <= t + 1e-6);
  if (index < 0) index = 0;
  const slot = edit.slots[index], local = t - starts[index];

  // Header clock and blinking REC dot (1 Hz).
  $('clock').textContent = `00:00:${String(Math.floor(t)).padStart(2, '0')}`;
  $('rec').style.opacity = (t % 1) < 0.6 ? 1 : 0.25;

  // Title: typewriter over TYPE s; if the new title extends the previous one, only the new part types.
  const items = slot.text.filter(item => item.at <= local + 1e-6);
  const item = items.at(-1), prev = items.at(-2);
  if (item) {
    const list = chars(item.title);
    const kept = prev && item.title.startsWith(prev.title) ? chars(prev.title).length : prev && prev.title === item.title ? list.length : 0;
    const typed = kept + Math.ceil((list.length - kept) * Math.min(1, (local - item.at) / TYPE));
    const typing = typed < list.length || (local - item.at) < TYPE + 0.1;
    $('title').className = 'title' + (item.size === 'xl' ? ' xl' : '');
    $('title').style.fontSize = `${item.fontSize}px`;
    $('title').innerHTML = titleHtml(list.slice(0, typed), typing && kept < list.length);
    // Subs slide in one after another; kept when the next item repeats them.
    const sameSubs = prev && JSON.stringify(prev.sub ?? []) === JSON.stringify(item.sub ?? []);
    $('subs').innerHTML = (item.sub ?? []).map((text, i) => {
      const p = sameSubs ? 1 : ease((local - item.at - SUB_DELAY - i * SUB_STEP) / SUB_IN);
      return `<div class="sub" style="opacity:${p};transform:translateX(${(1 - p) * -48}px)">${subHtml(text)}</div>`;
    }).join('');
  } else { $('title').innerHTML = ''; $('subs').innerHTML = ''; }

  // File card: classification tag; stamp slams in with overshoot.
  $('card').innerHTML = slot.card ? '<div class="card-tag">SINIFLANDIRMA: AÇIK KAYNAK</div>' : '';
  if (slot.stamp && local >= slot.stamp.at) {
    const p = Math.min(1, (local - slot.stamp.at) / 0.12);
    const scale = 1.9 - 0.9 * ease(p) + (p >= 1 ? Math.max(0, 0.04 * Math.sin((local - slot.stamp.at - 0.12) * 40) * Math.exp(-(local - slot.stamp.at) * 12)) : 0);
    $('stamp').innerHTML = `<div class="stamp" style="opacity:${0.25 + 0.65 * p};transform:rotate(-11deg) scale(${scale})">${esc(slot.stamp.text)}</div>`;
  } else $('stamp').innerHTML = '';
  $('disclaimer').innerHTML = slot.disclaimer && edit.disclaimer ? `<div class="disclaimer">${esc(edit.disclaimer)}</div>` : '';

  // Two-frame white flash at the start of flagged slots (60 fps frames).
  const f = Math.round(local * 60);
  $('flash').style.opacity = slot.flash && f < FLASH.length ? FLASH[f] : 0;
  // compose.ts reuses the previous screenshot while this key does not change.
  return document.body.innerHTML;
};
</script>
</body>
</html>
